<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbatim — Link-to-Transcript Studio</title>
    <meta
      name="description"
      content="Extract accurate timestamped or plain-text transcripts from YouTube, TikTok, Instagram, Facebook, X, Vimeo, and direct media links."
    />
    <meta name="application-name" content="Verbatim" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="__APP_ORIGIN__/" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph (Facebook, LinkedIn, WhatsApp, Discord, Slack, Telegram, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verbatim" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__APP_ORIGIN__/" />
    <meta property="og:title" content="Verbatim — Link-to-Transcript Studio" />
    <meta
      property="og:description"
      content="Extract accurate timestamped or plain-text transcripts from YouTube, TikTok, Instagram, Facebook, X, Vimeo, and direct media links."
    />
    <meta property="og:image" content="__APP_ORIGIN__/og-image.png" />
    <meta property="og:image:secure_url" content="__APP_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Verbatim — Accurate transcripts from any video or audio link, with timestamps, multi-language translation, and multi-format export."
    />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="__APP_ORIGIN__/" />
    <meta name="twitter:title" content="Verbatim — Link-to-Transcript Studio" />
    <meta
      name="twitter:description"
      content="Extract accurate timestamped or plain-text transcripts from YouTube, TikTok, Instagram, Facebook, X, Vimeo, and direct media links."
    />
    <meta name="twitter:image" content="__APP_ORIGIN__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Verbatim — Link-to-Transcript Studio preview card."
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Verbatim",
        "url": "__APP_ORIGIN__/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "All",
        "description": "Extract accurate timestamped or plain-text transcripts from YouTube, TikTok, Instagram, Facebook, X, Vimeo, and direct media links.",
        "image": "__APP_ORIGIN__/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
